  <!-- 1. Load the official Supabase Client Library -->
  <script src="https://jsdelivr.net"></script>

  <script>
    // 2. Insert the credentials you copied in Step 1
    const SUPABASE_URL = 'https://aoswhbdblfljhkninzra.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Q4AVBpJnjfJF-5s-8FLpCg_6Qdx70Ve';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. Attach a live click click event handler to your payment button
    document.getElementById('submit-btn').addEventListener('click', async (e) => {
      e.preventDefault(); // Stop the page from refreshing automatically
      
      const statusDisplay = document.getElementById('status-display');
      const modal = document.getElementById('custom-modal');
      
      // Collect values typed into the registration form fields
      const fullName = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      // Basic local validation check before talking to the server
      if (!fullName || !email || !phone) {
        alert("Please complete your profile details (Name, Email, and Phone Number) before confirming.");
        return;
      }

      try {
        statusDisplay.innerText = "⚙️ System Status: Submitting attendee profile data securely...";
        
        // 4. Insert data directly into your 'customers' database table
        const { data, error } = await supabase
          .from('customers')
          .insert([
            { 
              full_name: fullName, 
              email: email, 
              phone: phone 
            }
          ])
          .select(); // Returns the created user profile row along with its new ID

        if (error) throw error;

        // 5. Notify the attendee that their profile registration went through successfully!
        document.getElementById('modal-title').innerText = "Registration Logged Successfully";
        document.getElementById('modal-message').innerText = `Thank you ${fullName}!\nYour profile has been saved to the attendee system.\n\nWe are initializing your ticket creation details now.`;
        modal.style.display = 'flex';
        statusDisplay.innerText = "⚙️ System Status: Attendee logged successfully!";

      } catch (err) {
        console.error("Database connection failure details:", err);
        statusDisplay.innerText = "⚙️ System Status: Execution Error.";
        alert("Could not register profile: " + err.message);
      }
    });

    function closeModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }
  </script>
</body>
